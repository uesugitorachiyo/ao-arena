apiVersion: ao2.run/v1
kind: Run
metadata:
  name: 01KARENAPLAN00000000000000
  description: AO Arena completion
spec:
  source:
    schema_version: ao2.sdd-plan.v1
    plan_id: 01KARENAPLAN00000000000000
    generated_at_utc: 2026-06-24T00:00:00.000000Z
  plan_kind: build
  goal: Make the AO Arena concrete enough that a junior engineer can scaffold and implement the deterministic benchmark and scoring layer without guessing.
  non_goals:
  - do not scaffold the AO Arena implementation repository
  - do not run live providers
  - do not mutate sibling repositories
  prompt:
    text: Fill the AO Arena until it is junior-engineer-ready and implementation-ready.
    sha256: '1111111111111111111111111111111111111111111111111111111111111111'
  target:
    repo_path: /Users/torachiyouesugi/Documents/public/ao-arena
    head_sha: '0000000000000000000000000000000000000000'
    head_subject: docs-only AO Arena planning target
    surface_map_sha256: '2222222222222222222222222222222222222222222222222222222222222222'
  provenance:
    attempts: 1
    provider: codex
    engine_sha: '3333333333333333333333333333333333333333'
    cli_version: ao2-local
  trust_boundary:
    control_plane_role: read_only_observer
    mutates_ao_artifacts: false
    ingest_authority: ao2-runner
    release_acceptance_owner: factory-v3 evaluator-closer
  tasks:
  - id: step_prd
    kind: edit
    deps: []
    paths:
    - docs/sdd/AO-ARENA-PRD.md
    rationale: Define the product, users, goals, non-goals, and AO framework relationships before implementation begins.
    acceptance:
    - define users and jobs to be done
    - document v0.1 goals and non-goals
    - include production readiness definition
  - id: step_architecture
    kind: edit
    deps:
    - step_prd
    paths:
    - docs/sdd/AO-ARENA-ARCHITECTURE.md
    rationale: Define future CLI, package boundaries, data flow, storage layout, and integration limits.
    acceptance:
    - define CLI commands and package responsibilities
    - describe benchmark-to-report data flow
    - document fixture mode and live mode boundaries
  - id: step_contracts
    kind: edit
    deps:
    - step_architecture
    paths:
    - docs/sdd/AO-ARENA-CONTRACTS.md
    rationale: Make every machine-readable contract and fixture expectation explicit.
    acceptance:
    - list schema paths for every contract family
    - define required fields and validation rules
    - include valid and invalid fixture names
  - id: step_scoring
    kind: edit
    deps:
    - step_contracts
    paths:
    - docs/sdd/AO-ARENA-SCORING.md
    rationale: Make benchmark outcomes deterministic and reproducible.
    acceptance:
    - define 100 point scoring formula
    - include penalties and tie breakers
    - include worked scoring examples
  - id: step_benchmark_suite
    kind: edit
    deps:
    - step_scoring
    paths:
    - docs/sdd/AO-ARENA-BENCHMARK-SUITE.md
    rationale: Define the canonical comparison tasks before product scaffolding.
    acceptance:
    - define exactly eight benchmark tasks
    - include bare Codex and AO orchestration prompts
    - document expected evidence and stop conditions
  - id: step_safety
    kind: edit
    deps:
    - step_contracts
    paths:
    - docs/sdd/AO-ARENA-SAFETY.md
    rationale: Keep AO Arena public-safe and fail-closed by default.
    acceptance:
    - define forbidden actions in fixture mode
    - list secret and local path detection rules
    - document live run opt in requirements
  - id: step_slices
    kind: edit
    deps:
    - step_benchmark_suite
    - step_safety
    paths:
    - docs/sdd/AO-ARENA-IMPLEMENTATION-SLICES.md
    rationale: Translate the SDD into junior-engineer-sized implementation work.
    acceptance:
    - define exact future files per slice
    - include test commands and acceptance checks
    - order slices by dependency
  - id: step_acceptance_gates
    kind: edit
    deps:
    - step_slices
    paths:
    - docs/sdd/AO-ARENA-ACCEPTANCE-GATES.md
    rationale: Define what 100 percent plan and product readiness mean.
    acceptance:
    - define SDD pack readiness gate
    - define product verification commands
    - define competitive and public safety gates
  - id: step_handoff
    kind: edit
    deps:
    - step_acceptance_gates
    paths:
    - README.md
    - docs/sdd/AO-ARENA-SDD-HANDOFF.md
    rationale: Provide a clear handoff from planning to AO Foundry or AO Forge implementation.
    acceptance:
    - document SDD file index in README
    - write handoff prompt with constraints
    - include implementation readiness verdict
  - id: step_validation
    kind: verify
    deps:
    - step_handoff
    paths:
    - docs/sdd/AO-ARENA-SDD-PLANNER-PROMPT.md
    - docs/sdd/AO-ARENA-SDD-HANDOFF.md
    rationale: Prove the SDD pack is concrete and ready for implementation planning.
    acceptance:
    - verify AO2 SDD validation passes
    - scan docs for placeholder text
    - report remaining blockers if any
  exit_criteria:
    tests:
    - ao2 sdd validate --plan /Users/torachiyouesugi/Documents/public/ao-arena/target/ao-arena-plan.json
    - python3 -m json.tool /Users/torachiyouesugi/Documents/public/ao-arena/target/ao-arena-plan.json
    gates:
    - git diff --check
    manual:
    - git status --short --branch
